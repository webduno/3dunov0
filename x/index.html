<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    let scene, camera, renderer, controls, composer, clock;
    let soldier, mixer, animations = {};
    let spiritParticles = [], magicCircles = [], energyTrails = [];
    let ambientParticles;
    let isLoaded = false;
    let score = 0;
    let energy = 0;
    let maxEnergy = 5;
    let health = 100;
    let maxHealth = 100;
    let lastDamageTime = -Infinity;
    let orbs = [];
    let raycaster = new THREE.Raycaster();
    let pointer = new THREE.Vector2();
    let isMobile = 'ontouchstart' in window;
    let gameOver = false;
    let spawnInterval;
    let damagePass;

    const cursorEl = document.getElementById('cursor');
    const scoreEl = document.getElementById('score');
    const energyEl = document.getElementById('energy');
    const healthEl = document.getElementById('health');
    const gameoverEl = document.getElementById('gameover');
    const finalScoreEl = document.getElementById('finalScore');
    const spiritBtn = document.getElementById('spiritBtn');
    const tryAgainBtn = document.getElementById('tryAgainBtn');

    if (isMobile) {
        cursorEl.style.display = 'none';
        document.body.style.cursor = 'auto';
    } else {
        document.addEventListener('mousemove', (e) => {
            cursorEl.style.left = e.clientX - 10 + 'px';
            cursorEl.style.top = e.clientY - 10 + 'px';
        });
    }

    const VolumetricLightShader = {
        uniforms: {
            tDiffuse: { value: null },
            lightPosition: { value: new THREE.Vector2(0.5, 0.5) },
            exposure: { value: 0.4 },
            decay: { value: 0.95 },
            density: { value: 0.8 },
            weight: { value: 0.6 },
            samples: { value: 100 }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            varying vec2 vUv;
            uniform sampler2D tDiffuse;
            uniform vec2 lightPosition;
            uniform float exposure;
            uniform float decay;
            uniform float density;
            uniform float weight;
            uniform int samples;
            
            void main() {
                vec2 coord = vUv;
                vec2 deltaCoord = coord - lightPosition;
                deltaCoord *= 1.0 / float(samples) * density;
                
                float illuminationDecay = 1.0;
                vec4 color = vec4(0.0);
                
                for(int i = 0; i < 100; i++) {
                    if(i >= samples) break;
                    coord -= deltaCoord;
                    vec4 texel = texture2D(tDiffuse, coord);
                    texel *= illuminationDecay * weight;
                    color += texel;
                    illuminationDecay *= decay;
                }
                
                color *= exposure;
                gl_FragColor = color + texture2D(tDiffuse, vUv);
            }
        `
    };

    const SpiritParticleShader = {
        uniforms: {
            time: { value: 0.0 },
            size: { value: 50.0 },
            opacity: { value: 1.0 }
        },
        vertexShader: `
            uniform float time;
            uniform float size;
            attribute float scale;
            attribute vec3 velocity;
            attribute float life;
            varying float vLife;
            varying vec3 vColor;
            
            void main() {
                vLife = life;
                vec3 pos = position + velocity * time;
                
                float angle = time * 2.0 + position.x;
                pos.x += sin(angle) * 0.5;
                pos.z += cos(angle) * 0.5;
                
                vColor = mix(vec3(0.0, 0.8, 1.0), vec3(0.8, 0.2, 1.0), sin(time + position.x) * 0.5 + 0.5);
                
                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_PointSize = size * scale * (1.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `,
        fragmentShader: `
            uniform float opacity;
            varying float vLife;
            varying vec3 vColor;
            
            void main() {
                vec2 center = gl_PointCoord - 0.5;
                float dist = length(center);
                if(dist > 0.5) discard;
                
                float alpha = (1.0 - dist * 2.0) * vLife * opacity;
                gl_FragColor = vec4(vColor, alpha);
            }
        `
    };

    const DamageShader = {
        uniforms: {
            tDiffuse: { value: null },
            time: { value: 0.0 },
            damageTime: { value: -Infinity }
        },
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform sampler2D tDiffuse;
            uniform float time;
            uniform float damageTime;
            varying vec2 vUv;
            
            void main() {
                vec4 color = texture2D(tDiffuse, vUv);
                float delta = time - damageTime;
                if (delta < 1.0) {
                    float intensity = sin(delta * 3.14159 * 5.0) * exp(-delta * 3.0);
                    color.rgb += vec3(1.0, 0.0, 0.0) * intensity * 0.5;
                }
                gl_FragColor = color;
            }
        `
    };

    init();

    async function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 12);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        renderer.domElement.addEventListener('pointerdown', onPointerDown);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 2, 0);
        controls.maxPolarAngle = Math.PI * 0.8;
        controls.minDistance = 5;
        controls.maxDistance = 30;

        createEpicEnvironment();
        createCinematicLighting();
        createAtmosphere();
        await loadSoldier();
        setupPostProcessing();

        spiritBtn.addEventListener('click', releaseSpirit);
        tryAgainBtn.addEventListener('click', resetGame);
        window.addEventListener('resize', onWindowResize);

        spawnInterval = setInterval(spawnOrb, 1500);

        updateUI();
        animate();
    }

    function resetGame() {
        score = 0;
        energy = 0;
        health = maxHealth;
        gameOver = false;
        orbs.forEach(orb => {
            scene.remove(orb);
            orb.geometry.dispose();
            orb.material.dispose();
        });
        orbs = [];
        gameoverEl.style.display = 'none';
        spawnInterval = setInterval(spawnOrb, 1500);
        updateUI();
    }

    function onPointerDown(event) {
        if (gameOver) return;
        event.preventDefault();

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = - ((event.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);

        const intersects = raycaster.intersectObjects(orbs);
        if (intersects.length > 0) {
            const orb = intersects[0].object;
            collectOrb(orb);
        }
    }

    function spawnOrb() {
        if (gameOver) return;
        const geometry = new THREE.SphereGeometry(0.5, 16, 16);
        const material = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const orb = new THREE.Mesh(geometry, material);
        orb.position.set(
            (Math.random() - 0.5) * 40,
            Math.random() * 10 + 2,
            (Math.random() - 0.5) * 40
        );
        orb.userData = { life: 15 };
        scene.add(orb);
        orbs.push(orb);
    }

    function collectOrb(orb) {
        energy = Math.min(energy + 1, maxEnergy);
        updateUI();
        scene.remove(orb);
        orbs.splice(orbs.indexOf(orb), 1);
        orb.geometry.dispose();
        orb.material.dispose();

        // Trigger collect animation (placeholder: play 'Run' as collect pose)
        if (animations['Run']) {
            animations['Idle'].fadeOut(0.2);
            animations['Run'].reset().fadeIn(0.2).play();
            setTimeout(() => {
                animations['Run'].fadeOut(0.2);
                animations['Idle'].reset().fadeIn(0.2).play();
            }, 1000); // Play for 1 second, adjust as needed
        }

        // TODO: When new FBX animation is added, load it here and apply to mixer
        // Example:
        // const fbxLoader = new FBXLoader();
        // fbxLoader.load('path/to/new_animation.fbx', (fbx) => {
        //     const newClip = fbx.animations[0];
        //     const action = mixer.clipAction(newClip);
        //     action.play(); // or similar
        // });
    }

    function updateUI() {
        scoreEl.textContent = `Score: ${score}`;
        energyEl.textContent = `Energy: ${energy}/${maxEnergy}`;
        healthEl.textContent = `Health: ${health}/${maxHealth}`;
        spiritBtn.disabled = energy < maxEnergy;
    }

    function checkGameOver() {
        if (health <= 0 && !gameOver) {
            gameOver = true;
            clearInterval(spawnInterval);
            spiritBtn.disabled = true;
            finalScoreEl.textContent = score;
            gameoverEl.style.display = 'block';
        }
    }

    function createEpicEnvironment() {
        const skyGeometry = new THREE.SphereGeometry(500, 60, 40);
        const skyMaterial = new THREE.ShaderMaterial({
            uniforms: {
                topColor: { value: new THREE.Color(0x001122) },
                bottomColor: { value: new THREE.Color(0x000000) },
                offset: { value: 400 },
                exponent: { value: 0.6 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 bottomColor;
                uniform float offset;
                uniform float exponent;
                varying vec3 vWorldPosition;
                void main() {
                    float h = normalize(vWorldPosition + offset).y;
                    gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                }
            `,
            side: THREE.BackSide
        });
        scene.add(new THREE.Mesh(skyGeometry, skyMaterial));

        const groundGeometry = new THREE.PlaneGeometry(200, 200, 100, 100);
        const positions = groundGeometry.attributes.position.array;
        
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const y = positions[i + 1];
            positions[i + 2] = Math.sin(x * 0.02) * Math.cos(y * 0.02) * 2;
        }
        groundGeometry.attributes.position.needsUpdate = true;
        groundGeometry.computeVertexNormals();

        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.8,
            metalness: 0.3,
            transparent: true,
            opacity: 0.9
        });

        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        scene.fog = new THREE.FogExp2(0x000011, 0.01);
    }

    function createCinematicLighting() {
        const ambientLight = new THREE.AmbientLight(0x404080, 0.8);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
        keyLight.position.set(20, 30, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 4096;
        keyLight.shadow.mapSize.height = 4096;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 100;
        keyLight.shadow.camera.left = -50;
        keyLight.shadow.camera.right = 50;
        keyLight.shadow.camera.top = 50;
        keyLight.shadow.camera.bottom = -50;
        keyLight.shadow.bias = -0.0001;
        scene.add(keyLight);

        const rimLight = new THREE.DirectionalLight(0x0088ff, 2.5);
        rimLight.position.set(-15, 10, -10);
        scene.add(rimLight);

        const fillLight = new THREE.DirectionalLight(0xffaa44, 1.5);
        fillLight.position.set(8, 5, 15);
        scene.add(fillLight);

        const accentLight1 = new THREE.PointLight(0x00ffff, 2, 30);
        accentLight1.position.set(10, 5, 10);
        scene.add(accentLight1);

        const accentLight2 = new THREE.PointLight(0xff00ff, 2, 30);
        accentLight2.position.set(-10, 5, -10);
        scene.add(accentLight2);
    }

    function createAtmosphere() {
        const particleCount = 3000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3);
        const scales = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 200;
            positions[i * 3 + 1] = Math.random() * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 200;

            velocities[i * 3] = (Math.random() - 0.5) * 0.1;
            velocities[i * 3 + 1] = Math.random() * 0.2 + 0.1;
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.1;

            scales[i] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
        geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                size: { value: 2.0 }
            },
            vertexShader: `
                uniform float time;
                uniform float size;
                attribute float scale;
                attribute vec3 velocity;
                varying float vAlpha;
                
                void main() {
                    vAlpha = scale;
                    vec3 pos = position + velocity * time;
                    pos.y = mod(pos.y, 50.0);
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * scale * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying float vAlpha;
                void main() {
                    vec2 center = gl_PointCoord - 0.5;
                    float dist = length(center);
                    if(dist > 0.5) discard;
                    
                    float alpha = (1.0 - dist * 2.0) * vAlpha * 0.3;
                    gl_FragColor = vec4(0.5, 0.8, 1.0, alpha);
                }
            `,
            transparent: true,
            depthWrite: false
        });

        ambientParticles = new THREE.Points(geometry, material);
        scene.add(ambientParticles);
    }

    async function loadSoldier() {
        const loader = new GLTFLoader();
        
        try {
            const gltf = await new Promise((resolve, reject) => {
                loader.load(
                    'https://threejs.org/examples/models/gltf/Soldier.glb',
                    resolve,
                    undefined,
                    reject
                );
            });

            soldier = gltf.scene;
            soldier.scale.set(4, 4, 4);
            soldier.position.set(0, 0, 0);
            soldier.rotation.y = Math.PI;

            soldier.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    if (child.material) {
                        child.material.roughness = 0.7;
                        child.material.metalness = 0.2;
                    }
                }
            });

            scene.add(soldier);

            mixer = new THREE.AnimationMixer(soldier);
            gltf.animations.forEach((clip) => {
                animations[clip.name] = mixer.clipAction(clip);
            });

            if (animations['Idle']) {
                animations['Idle'].play();
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('spiritBtn').style.display = 'block';
            isLoaded = true;

        } catch (error) {
            createFallbackSoldier();
        }
    }

    function createFallbackSoldier() {
        const geometry = new THREE.CapsuleGeometry(0.8, 3, 4, 8);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x4a4a4a,
            roughness: 0.7,
            metalness: 0.2
        });
        
        soldier = new THREE.Mesh(geometry, material);
        soldier.position.set(0, 1.5, 0);
        soldier.castShadow = true;
        soldier.receiveShadow = true;
        scene.add(soldier);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('spiritBtn').style.display = 'block';
        isLoaded = true;
    }

    function releaseSpirit() {
        if (energy < maxEnergy || !soldier || gameOver) return;

        releaseSpiritEffect();
        score += energy;
        energy = 0;
        updateUI();
    }

    function releaseSpiritEffect() {
        createSpiritParticles();
        createMagicCircle();
        createEnergyTrails();
    }

    function createSpiritParticles() {
        const particleCount = 2000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3);
        const scales = new Float32Array(particleCount);
        const lives = new Float32Array(particleCount);

        const soldierPos = soldier.position;

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = soldierPos.x + (Math.random() - 0.5) * 4;
            positions[i * 3 + 1] = soldierPos.y + Math.random() * 4;
            positions[i * 3 + 2] = soldierPos.z + (Math.random() - 0.5) * 4;

            velocities[i * 3] = (Math.random() - 0.5) * 2;
            velocities[i * 3 + 1] = Math.random() * 8 + 5;
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 2;

            scales[i] = Math.random() * 0.5 + 0.5;
            lives[i] = Math.random() * 2 + 3;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
        geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));
        geometry.setAttribute('life', new THREE.BufferAttribute(lives, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: SpiritParticleShader.uniforms,
            vertexShader: SpiritParticleShader.vertexShader,
            fragmentShader: SpiritParticleShader.fragmentShader,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const spiritSystem = new THREE.Points(geometry, material);
        spiritSystem.userData = { 
            life: 5, 
            maxLife: 5,
            startTime: clock.getElapsedTime()
        };
        
        spiritParticles.push(spiritSystem);
        scene.add(spiritSystem);
    }

    function createMagicCircle() {
        const circleGeometry = new THREE.RingGeometry(2, 2.1, 64);
        const circleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                opacity: { value: 1 }
            },
            vertexShader: `
                uniform float time;
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    vec3 pos = position;
                    pos.y += sin(time * 4.0 + position.x * 10.0) * 0.1;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float opacity;
                varying vec2 vUv;
                void main() {
                    float pulse = sin(time * 3.0) * 0.5 + 0.5;
                    vec3 color = mix(vec3(0.0, 0.8, 1.0), vec3(0.8, 0.2, 1.0), pulse);
                    gl_FragColor = vec4(color, opacity);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const magicCircle = new THREE.Mesh(circleGeometry, circleMaterial);
        magicCircle.position.copy(soldier.position);
        magicCircle.position.y += 0.1;
        magicCircle.rotation.x = -Math.PI / 2;
        magicCircle.userData = { 
            life: 3, 
            maxLife: 3,
            startTime: clock.getElapsedTime()
        };

        magicCircles.push(magicCircle);
        scene.add(magicCircle);
    }

    function createEnergyTrails() {
        for (let i = 0; i < 8; i++) {
            const trailGeometry = new THREE.CylinderGeometry(0.05, 0.2, 10, 8);
            const trailMaterial = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(0.6 + Math.random() * 0.2, 1, 0.5),
                transparent: true,
                opacity: 0.8
            });

            const trail = new THREE.Mesh(trailGeometry, trailMaterial);
            const angle = (i / 8) * Math.PI * 2;
            trail.position.copy(soldier.position);
            trail.position.x += Math.cos(angle) * 3;
            trail.position.z += Math.sin(angle) * 3;
            trail.position.y += 2;
            
            trail.userData = {
                life: 2,
                maxLife: 2,
                angle: angle,
                startTime: clock.getElapsedTime()
            };

            energyTrails.push(trail);
            scene.add(trail);
        }
    }

    function setupPostProcessing() {
        composer = new EffectComposer(renderer);
        
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.3, 0.8, 0.1
        );
        composer.addPass(bloomPass);

        const volumetricPass = new ShaderPass(VolumetricLightShader);
        volumetricPass.needsSwap = true;
        composer.addPass(volumetricPass);

        damagePass = new ShaderPass(DamageShader);
        composer.addPass(damagePass);
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        controls.update();

        if (mixer && isLoaded) {
            mixer.update(delta);
        }

        if (ambientParticles) {
            ambientParticles.material.uniforms.time.value = elapsed * 0.5;
        }

        spiritParticles.forEach((system, index) => {
            const life = system.userData.life - delta;
            system.userData.life = life;
            
            if (life > 0) {
                const progress = life / system.userData.maxLife;
                system.material.uniforms.time.value = elapsed - system.userData.startTime;
                system.material.uniforms.opacity.value = progress;
            } else {
                scene.remove(system);
                system.geometry.dispose();
                system.material.dispose();
                spiritParticles.splice(index, 1);
            }
        });

        magicCircles.forEach((circle, index) => {
            const life = circle.userData.life - delta;
            circle.userData.life = life;
            
            if (life > 0) {
                const progress = life / circle.userData.maxLife;
                circle.material.uniforms.time.value = elapsed - circle.userData.startTime;
                circle.material.uniforms.opacity.value = progress;
                circle.scale.setScalar(2 - progress);
            } else {
                scene.remove(circle);
                circle.geometry.dispose();
                circle.material.dispose();
                magicCircles.splice(index, 1);
            }
        });

        energyTrails.forEach((trail, index) => {
            const life = trail.userData.life - delta;
            trail.userData.life = life;
            
            if (life > 0) {
                const progress = life / trail.userData.maxLife;
                trail.position.y += 8 * delta;
                trail.material.opacity = progress;
                trail.rotation.y += delta * 2;
            } else {
                scene.remove(trail);
                trail.geometry.dispose();
                trail.material.dispose();
                energyTrails.splice(index, 1);
            }
        });

        orbs.forEach((orb, index) => {
            orb.userData.life -= delta;
            if (orb.userData.life <= 0) {
                health = Math.max(health - 10, 0);
                lastDamageTime = elapsed;
                updateUI();
                checkGameOver();
                scene.remove(orb);
                orb.geometry.dispose();
                orb.material.dispose();
                orbs.splice(index, 1);
                return;
            }
            orb.position.y += Math.sin(elapsed + orb.position.x) * 0.01;
        });

        damagePass.uniforms.time.value = elapsed;
        damagePass.uniforms.damageTime.value = lastDamageTime;

        if (composer) {
            composer.render();
        } else {
            renderer.render(scene, camera);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (composer) {
            composer.setSize(window.innerWidth, window.innerHeight);
        }
    }
</script>
